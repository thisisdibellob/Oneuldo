# Opt in only after /api/limits confirms support for context 24576 and output 3200.
# Keep the existing ollama profile compatible with gateways that have not been upgraded.
# Activate together: --spring.profiles.active=ollama,ollama-large
ai.ollama.context-length=${OLLAMA_CONTEXT_LENGTH:24576}
ai.behavior-analysis.request-token-budget=${OLLAMA_REQUEST_TOKEN_BUDGET:24000}
ai.behavior-analysis.final-output-tokens=${OLLAMA_FINAL_OUTPUT_TOKENS:3200}
