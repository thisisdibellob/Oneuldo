# Activate with --spring.profiles.active=ollama (or append ollama to existing profiles).
# This profile selects only Ollama. It never falls back to Groq.
ai.ollama.base-url=${OLLAMA_BASE_URL:https://oneuldo.duckdns.org}
ai.ollama.api-key=${OLLAMA_API_KEY:}
ai.ollama.model=qwen3.6:27b-q4_K_M
ai.ollama.context-length=${OLLAMA_CONTEXT_LENGTH:18432}
ai.ollama.timeout=${OLLAMA_TIMEOUT:PT15M}
ai.ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:PT15S}
ai.ollama.connect-retries=${OLLAMA_CONNECT_RETRIES:2}
ai.ollama.connect-retry-delay=${OLLAMA_CONNECT_RETRY_DELAY:PT1S}
ai.ollama.queue-timeout=${OLLAMA_QUEUE_TIMEOUT:PT10M}
ai.ollama.max-queued=${OLLAMA_MAX_QUEUED:8}
ai.ollama.keep-alive=10m
ai.model=${ai.ollama.model}
# Reserve room for complete observation/reduction JSON as well as the final result.
# School TITAN gateway supports 18432; 18000 + framing (32) stays below its 18176-token guard.
# The laptop preset explicitly uses context 8192 / budget 7800.
ai.behavior-analysis.request-token-budget=${OLLAMA_REQUEST_TOKEN_BUDGET:18000}
ai.behavior-analysis.chunk-output-tokens=${OLLAMA_CHUNK_OUTPUT_TOKENS:1800}
ai.behavior-analysis.final-output-tokens=${OLLAMA_FINAL_OUTPUT_TOKENS:1800}
# Update the revision whenever the installed model is replaced, even under the same tag.
ai.cache-identity=ollama:${ai.model}:${OLLAMA_MODEL_REVISION:3a40c32f1450b8380412898385b0e00df5d6d2d801dd192ca1acb7e735cd050e}:ctx${ai.ollama.context-length}:think-false:top-p-0.8

# One bounded model review of the draft against the same source before publishing.
ai.behavior-analysis.quality-review=${OLLAMA_QUALITY_REVIEW:true}
