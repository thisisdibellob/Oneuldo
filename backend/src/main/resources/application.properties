spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

spring.application.name=oneuldo

# JWT 비밀키는 환경변수로 설정하고 저장소에 공개하지 않는다.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=oneuldo
# Access Token 만료시간: 30분
security.jwt.access-expiration=PT30M
# Refresh Token 만료시간: 14일
security.jwt.refresh-expiration=P14D

# Hibernate가 테이블을 직접 만들거나 수정하지 않고,
# Entity와 실제 DB 테이블 구조가 일치하는지 검증만 수행하도록 설정
spring.jpa.hibernate.ddl-auto=validate

# 애플리케이션 실행 시 Flyway를 사용하여 DB 마이그레이션을 수행하도록 설정
spring.flyway.enabled=true

# DB 조회는 Service 계층 안에서 끝내도록 설정합니다.
# Controller나 화면 처리 단계까지 DB 연결이 유지되는 것을 막습니다.
spring.jpa.open-in-view=false



# 로컬 PostgreSQL 연결 주소
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/oneuldo}

# 로컬 PostgreSQL 사용자 이름
spring.datasource.username=${DB_USERNAME:oneuldo}

# 로컬 PostgreSQL 비밀번호
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL JDBC 드라이버
spring.datasource.driver-class-name=org.postgresql.Driver

# 수집 트랜잭션 이후 누락된 행동 로그 정규화를 주기적으로 복구한다.
behavior-log.normalization.recovery-delay=PT1M
behavior-log.normalization.recovery-batch-size=100
