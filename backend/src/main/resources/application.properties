spring.application.name=oneuldo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate가 테이블을 직접 만들거나 수정하지 않고,
# Entity와 실제 DB 테이블 구조가 일치하는지 검증만 수행하도록 설정
spring.jpa.hibernate.ddl-auto=validate

# 애플리케이션 실행 시 Flyway를 사용하여 DB 마이그레이션을 수행하도록 설정
spring.flyway.enabled=true

# DB 조회는 Service 계층 안에서 끝내도록 설정합니다.
# Controller나 화면 처리 단계까지 DB 연결이 유지되는 것을 막습니다.
spring.jpa.open-in-view=false