spring.datasource.url=jdbc:h2:mem:oneuldo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop 
spring.flyway.enabled=false

# 테스트에서만 사용하는 JWT 비밀키입니다.
# 실제 서비스 비밀키가 아니므로 운영 환경에서는 사용하지 않습니다.
# Base64로 인코딩된 32바이트 테스트 문자열입니다.
security.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

# 테스트 JWT를 발급한 서버를 구분하는 값입니다.
security.jwt.issuer=oneuldo-test

# 테스트 Access Token의 유효시간을 30분으로 설정합니다.
security.jwt.access-expiration=PT30M

# 테스트 Refresh Token의 유효시간을 14일로 설정합니다.
security.jwt.refresh-expiration=P14D