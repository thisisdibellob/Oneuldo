spring.application.name=oneuldo-ai-gateway
spring.config.import=optional:file:/etc/oneuldo-ai/keys.properties
server.address=127.0.0.1
server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=32
server.tomcat.max-connections=64
server.tomcat.accept-count=16
server.tomcat.connection-timeout=10s
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
gateway.upstream=http://127.0.0.1:11434
gateway.timeout=15m
gateway.queue-timeout=10m
gateway.max-queued=8
